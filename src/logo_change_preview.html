<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#E8E8E8; padding:32px; display:flex; flex-direction:column; gap:28px; }
  label { font-size:12px; font-weight:700; color:#666; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; display:block; }

  /* NavBar */
  .navbar {
    background:#FFFFFF;
    height:64px;
    display:flex;
    align-items:center;
    padding:0 16px;
    box-shadow:0 1px 8px rgba(0,0,0,.10);
    border-radius:12px;
    justify-content:space-between;
    border-bottom:2px solid #FF6600;
  }
  .nav-right { display:flex; align-items:center; gap:10px; }
  .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#FF6600,#FF9F1C); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; }

  /* PDF report preview */
  .pdf-doc { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 16px rgba(0,0,0,.12); max-width:680px; }
  .pdf-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 20px;
    background:#FFFFFF;
    border-bottom:2px solid #FF6600;
  }
  .pdf-company { text-align:right; }
  .pdf-company .name { font-size:15px; font-weight:900; color:#1A1A1A; }
  .pdf-company .sub { font-size:12px; color:#888; margin-top:2px; }
  .pdf-accent { height:3px; background:linear-gradient(90deg,#FFD700,#FF6600); }
  .pdf-body { padding:20px; }
  .pdf-body h2 { color:#FF6600; font-size:16px; margin-bottom:12px; }
  .pdf-table { width:100%; border-collapse:collapse; font-size:13px; }
  .pdf-table th { background:#FFF3EB; padding:9px 12px; text-align:left; color:#FF6600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .pdf-table td { padding:9px 12px; border-bottom:1px solid #f0f0f0; }
  .pdf-footer-line { text-align:center; color:#aaa; font-size:11px; padding:14px; border-top:1px solid #eee; }
</style>
</head>
